# Test overrides. classpath:/config/application.yml wins over the main file: an in-memory database,
# and no broker unless a test asks for one.
spring:
  datasource:
    url: jdbc:h2:mem:reporting;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  modulith:
    events:
      externalization:
        enabled: false
  kafka:
    admin:
      auto-create: false
