# The area's tests. The real applications' settings live in the modulith and in the warehousing
# service; here only what a test run needs: an in-memory database, migrated by the area's own
# scripts (then checked against the entities: ddl-auto validate, from the chassis), and a token
# setting so the resource server starts. The tests send ready-made tokens (TestCallers): nothing
# is fetched from that address.
spring:
  datasource:
    url: jdbc:h2:mem:transportation;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost/jwks
