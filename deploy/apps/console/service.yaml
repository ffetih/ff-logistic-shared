# console:8080 inside the cluster. NodePort 30090, which k3d publishes on host port 8090.
apiVersion: v1
kind: Service
metadata:
  name: console
  labels:
    app.kubernetes.io/name: console
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: console
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
      nodePort: 30090
