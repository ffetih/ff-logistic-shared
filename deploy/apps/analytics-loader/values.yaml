# The analytics loader, every environment. Overrides the chart's defaults
# (ff-logistic-runtime: deploy/charts/ff-service/values.yaml).
image:
  repository: ghcr.io/ffetih/ff-logistic-shared/analytics-loader

containerPort: 8086

service:
  port: 8086

# One pod, a plain Deployment: no canary. The loader serves no traffic to split, and Kafka hands
# the partitions over to the new pod when the old one leaves the consumer group.
replicaCount: 1

# Its own database, ff_logistics_analytics, on the shared PostgreSQL server: the first service to
# have one. The database Job creates it if missing (PreSync, weight -1), then the migrate Job
# creates its tables (weight 0).
database:
  create: true
  name: ff_logistics_analytics

migration:
  enabled: true

# Ready means its database and its consumer are up. The recount POST is authenticated and
# checks no role; this only checks that a caller without a token is refused.
smokeTest:
  enabled: true
  checks:
    - {path: /actuator/health/readiness, status: 200, contains: '"status":"UP"'}
    - {path: /api/v1/rollups, status: 401}

resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    memory: 512Mi
