# Serves the built console and forwards the two API prefixes, so the browser sees one origin:
#   /identity/...  -> identity service, prefix removed   (same as the dev server in vite.config.ts)
#   /api/...       -> the edge, path unchanged
# The backends therefore need no CORS settings.
#
# A template: the image's entrypoint writes it to conf.d with ${NGINX_LOCAL_RESOLVERS} filled in from
# /etc/resolv.conf (Dockerfile: NGINX_ENTRYPOINT_LOCAL_RESOLVERS). The backends are named in variables,
# so nginx asks that DNS again (valid=10s) instead of keeping the address it found at startup: a
# recreated app container gets a new address, and a fixed one would answer 502 until nginx restarts.
#
# nginx's own resolver does not use the search domains of /etc/resolv.conf. Compose's DNS answers the
# short names; Kubernetes' DNS answers only full names (identity.<namespace>.svc.cluster.local), so the
# cluster sets IDENTITY_UPSTREAM and APP_UPSTREAM (deploy/apps/console). Defaults: Dockerfile.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;
    set $identity_upstream ${IDENTITY_UPSTREAM};
    set $app_upstream ${APP_UPSTREAM};

    # On every answer, including proxied ones. Only "expires" is used below, never add_header,
    # because one add_header in a location would drop all of these for that location.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # Scripts, styles and API calls only from this origin: an injected inline script cannot run,
    # which also protects the tokens in sessionStorage. Images also from the map's tile server
    # (${MAP_TILE_ORIGIN}, Dockerfile), which must match the tiles the build uses (VITE_MAP_TILE_URL).
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: ${MAP_TILE_ORIGIN}; connect-src 'self' http://localhost:9000; frame-src 'self' http://localhost:8088; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location /identity/ {
        # With a variable, proxy_pass does not cut the prefix itself.
        rewrite ^/identity/(.*)$ /$1 break;
        proxy_pass $identity_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass $app_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Bundles carry a content hash in their name: cache them for good.
    location /assets/ {
        expires max;
    }

    # Every other path is a page of the single-page app (/warehouse, /routes, ...).
    location / {
        try_files $uri /index.html;
        expires -1;
    }
}
