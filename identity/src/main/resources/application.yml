server:
  port: 8085

spring:
  application:
    name: identity-service
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  jackson:
    deserialization:
      # Security API: a request with a field we do not define (for example "tenantId") is
      # rejected with 400 instead of being silently ignored.
      fail-on-unknown-properties: true

identity:
  broker-key: ${IDENTITY_BROKER_KEY:ff-identity-broker-dev}
  keycloak:
    # The defaults reach the cluster's Keycloak through NodePort 8180, so a run from the IDE
    # needs no settings. In the cluster the chart sets the base URL to http://keycloak:8080.
    # The issuer is Keycloak's public address in both cases.
    base-url: ${IDENTITY_KEYCLOAK_BASE_URL:http://localhost:8180}
    issuer: ${IDENTITY_KEYCLOAK_ISSUER:http://localhost:8180/realms/ff-logistics}
    realm: ff-logistics
    api-client-id: ff-logistics-api
    audience: ff-logistics-api
    service-client-id: ff-logistics-service
    service-client-secret: ${IDENTITY_KEYCLOAK_SERVICE_CLIENT_SECRET:ff-logistics-service-secret}
    admin-username: ${IDENTITY_KEYCLOAK_ADMIN_USERNAME:admin}
    admin-password: ${IDENTITY_KEYCLOAK_ADMIN_PASSWORD:admin}
  # Same secret and audience as Superset (runtime deploy/platform/superset).
  # Empty secret: POST /api/v1/guest-tokens answers 503.
  superset:
    guest-token-secret: ${SUPERSET_GUEST_TOKEN_JWT_SECRET:ff-superset-guest-dev-2026-local}
    guest-token-audience: ${SUPERSET_GUEST_TOKEN_JWT_AUDIENCE:ff-logistic}
    guest-token-ttl: ${SUPERSET_GUEST_TOKEN_TTL:PT5M}

management:
  # This process does not use the chassis, so the export address is repeated here.
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  logging:
    export:
      otlp:
        enabled: false
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${TRACING_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
